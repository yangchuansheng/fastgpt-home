name: Technical full release image manifest bootstrap

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: 'Existing complete release source revision'
        required: true
        type: string
      bundle_sha256:
        description: 'Existing complete retained release bundle SHA-256'
        required: true
        type: string
      artifact_run_id:
        description: 'Workflow run containing the retained release bundle'
        required: true
        type: string
      artifact_name:
        description: 'Retained release bundle artifact name'
        required: true
        default: technical-full-release-bundle
        type: string
      cn_image_repository:
        description: 'CN GHCR image repository without a tag'
        required: true
        type: string
      io_image_repository:
        description: 'IO GHCR image repository without a tag'
        required: true
        type: string

concurrency:
  group: technical-full-release-image-bootstrap
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  bootstrap:
    if: github.repository == 'labring/fastgpt-home' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate immutable bootstrap inputs
        env:
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_revision }}
          RELEASE_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          RELEASE_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_CN_IMAGE_REPOSITORY: ${{ inputs.cn_image_repository }}
          RELEASE_IO_IMAGE_REPOSITORY: ${{ inputs.io_image_repository }}
        run: |
          test "$(printf '%s' "$RELEASE_SOURCE_COMMIT" | wc -c)" -eq 40
          test "$(printf '%s' "$RELEASE_BUNDLE_SHA256" | wc -c)" -eq 64
          printf '%s\n' "$RELEASE_SOURCE_COMMIT$RELEASE_BUNDLE_SHA256" | grep -Eq '^[a-f0-9]+$'
          printf '%s\n' "$RELEASE_ARTIFACT_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          for repository in "$RELEASE_CN_IMAGE_REPOSITORY" "$RELEASE_IO_IMAGE_REPOSITORY"; do
            printf '%s\n' "$repository" | grep -Eq '^ghcr\.io/[a-z0-9._/-]+$'
          done

      - name: Checkout trusted packaging source
        uses: actions/checkout@v4

      - name: Verify trusted packaging source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download retained baseline release bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/bootstrap-release

      - name: Verify retained baseline release bundle
        env:
          RELEASE_BUNDLE: ${{ runner.temp }}/bootstrap-release
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_revision }}
          RELEASE_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: npm run verify:technical-full-release-build-decision -- --verify-bundle "$RELEASE_BUNDLE" "$RELEASE_SOURCE_COMMIT" "$RELEASE_BUNDLE_SHA256"

      - name: Prepare isolated bootstrap runtime contexts
        env:
          RELEASE_BUNDLE: ${{ runner.temp }}/bootstrap-release
        run: |
          for site in cn io; do
            context="$RUNNER_TEMP/technical-release-bootstrap-$site"
            install -d "$context"
            cp Dockerfile nginx.conf nginx-security-headers.conf nginx-embeddable-security-headers.conf "$context/"
            cp -R "$RELEASE_BUNDLE/$site/out" "$context/release-out"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable bootstrap CN runtime
        id: build-bootstrap-cn
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/technical-release-bootstrap-cn
          target: release-runtime
          push: true
          tags: ${{ inputs.cn_image_repository }}:${{ inputs.source_revision }}-${{ inputs.bundle_sha256 }}-bootstrap-cn
          build-args: |
            RELEASE_SOURCE_COMMIT=${{ inputs.source_revision }}
            RELEASE_TREE_DIGEST=${{ inputs.bundle_sha256 }}
            RELEASE_ROLLBACK_TARGET=${{ inputs.bundle_sha256 }}
            RELEASE_ARTIFACT_ID=${{ inputs.source_revision }}
            RELEASE_PROVIDER=kubernetes

      - name: Build and push immutable bootstrap IO runtime
        id: build-bootstrap-io
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/technical-release-bootstrap-io
          target: release-runtime
          push: true
          tags: ${{ inputs.io_image_repository }}:${{ inputs.source_revision }}-${{ inputs.bundle_sha256 }}-bootstrap-io
          build-args: |
            RELEASE_SOURCE_COMMIT=${{ inputs.source_revision }}
            RELEASE_TREE_DIGEST=${{ inputs.bundle_sha256 }}
            RELEASE_ROLLBACK_TARGET=${{ inputs.bundle_sha256 }}
            RELEASE_ARTIFACT_ID=${{ inputs.source_revision }}
            RELEASE_PROVIDER=kubernetes

      - name: Generate bootstrap signed release image manifest
        env:
          RELEASE_IMAGE_MANIFEST_BOOTSTRAP: '1'
          RELEASE_BUNDLE: ${{ runner.temp }}/bootstrap-release
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_revision }}
          RELEASE_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          RELEASE_CN_IMAGE: ${{ inputs.cn_image_repository }}@${{ steps.build-bootstrap-cn.outputs.digest }}
          RELEASE_IO_IMAGE: ${{ inputs.io_image_repository }}@${{ steps.build-bootstrap-io.outputs.digest }}
          RELEASE_IMAGE_MANIFEST_KEY: ${{ secrets.TECHNICAL_RELEASE_IMAGE_MANIFEST_KEY }}
          RELEASE_IMAGE_MANIFEST_OUTPUT: ${{ runner.temp }}/image-manifest/manifest.json
          RELEASE_IMAGE_MANIFEST_SIGNATURE_OUTPUT: ${{ runner.temp }}/image-manifest/manifest.sig
        run: npm run generate:technical-full-release-image-manifest

      - name: Upload bootstrap signed release image manifest
        uses: actions/upload-artifact@v4
        with:
          name: technical-full-release-image-manifest-${{ inputs.source_revision }}
          path: ${{ runner.temp }}/image-manifest
          if-no-files-found: error
          retention-days: 90
