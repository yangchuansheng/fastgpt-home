name: Guide Release Verification

on:
  workflow_dispatch:
    inputs:
      retain_release_bundle:
        description: 'Retain the complete verified CN, IO, and Preview release bundle'
        required: false
        default: false
        type: boolean
      solutions_preview_target:
        description: 'Approved Solutions preview HTTPS target'
        required: false
        type: string
      solutions_approved_target:
        description: 'Trusted Solutions preview HTTPS target used by the release gate'
        required: false
        type: string
      solutions_preview_contract:
        description: 'Workspace path to the Solutions HTTP contract JSON'
        required: false
        type: string
      solutions_evidence_path:
        description: 'Workspace path to a runner-produced Solutions evidence JSON'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/guide-release-verification.yml'
      - '.github/workflows/fastgpt-home-image.yml'
      - '.github/workflows/technical-full-release-production.yml'
      - 'src/**'
      - 'content/**'
      - 'content/competitors/**'
      - 'public/**'
      - 'scripts/**'
      - 'docs/release/**'
      - 'scripts/verify-content-hygiene.js'
      - 'scripts/fix-html-lang.js'
      - 'Dockerfile.verify'
      - 'Dockerfile'
      - '.dockerignore'
      - 'next.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'postcss.config.js'
      - 'tailwind.config.ts'
      - 'tsconfig.json'
      - 'nginx.conf'
      - 'nginx-security-headers.conf'
      - 'nginx-embeddable-security-headers.conf'

concurrency:
  group: guide-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FASTGPT_SOLUTIONS_PREVIEW_TARGET: ${{ inputs.solutions_preview_target || vars.FASTGPT_SOLUTIONS_PREVIEW_TARGET }}
  FASTGPT_SOLUTIONS_APPROVED_PREVIEW_TARGET: ${{ inputs.solutions_approved_target || vars.FASTGPT_SOLUTIONS_APPROVED_PREVIEW_TARGET }}
  FASTGPT_SOLUTIONS_PREVIEW_CONTRACT: ${{ inputs.solutions_preview_contract || vars.FASTGPT_SOLUTIONS_PREVIEW_CONTRACT }}
  FASTGPT_SOLUTIONS_PREVIEW_EVIDENCE: ${{ inputs.solutions_evidence_path || vars.FASTGPT_SOLUTIONS_PREVIEW_EVIDENCE }}

jobs:
  verify:
    if: ${{ !inputs.retain_release_bundle || (github.repository == 'labring/fastgpt-home' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify three-variant release evidence
        env:
          RETAIN_RELEASE_BUNDLE: ${{ inputs.retain_release_bundle }}
          NEXT_PUBLIC_CRM_API_URL: ${{ inputs.retain_release_bundle && secrets.NEXT_PUBLIC_CRM_API_URL || '' }}
          NEXT_PUBLIC_ATTRIBUTION_STORAGE_MODE: ${{ inputs.retain_release_bundle && vars.NEXT_PUBLIC_ATTRIBUTION_STORAGE_MODE || '' }}
          CN_NEXT_PUBLIC_BAIDU_TONGJI: ${{ inputs.retain_release_bundle && secrets.NEXT_PUBLIC_BAIDU_TONGJI || '' }}
          CN_NEXT_PUBLIC_BAIDU_KEY: ${{ inputs.retain_release_bundle && secrets.NEXT_PUBLIC_BAIDU_KEY || '' }}
          CN_NEXT_PUBLIC_USER_URL: ${{ inputs.retain_release_bundle && secrets.NEXT_PUBLIC_USER_URL || '' }}
          CN_NEXT_PUBLIC_FILING_ADDRESS: ${{ inputs.retain_release_bundle && secrets.NEXT_PUBLIC_FILING_ADDRESS || '' }}
          CN_NEXT_PUBLIC_POLICE_FILING: ${{ inputs.retain_release_bundle && secrets.NEXT_PUBLIC_POLICE_FILING || '' }}
          CN_NEXT_PUBLIC_RYBBIT_TONGJI: ${{ inputs.retain_release_bundle && secrets.NEXT_PUBLIC_RYBBIT_TONGJI || '' }}
          CN_NEXT_PUBLIC_RYBBIT_TONGJI_SITEID: ${{ inputs.retain_release_bundle && secrets.NEXT_PUBLIC_RYBBIT_TONGJI_SITEID || '' }}
          CN_NEXT_PUBLIC_ATTRIBUTION_COOKIE_DOMAIN: ${{ inputs.retain_release_bundle && '.fastgpt.cn' || '' }}
          CN_NEXT_PUBLIC_ATTRIBUTION_SOURCE: ${{ inputs.retain_release_bundle && secrets.NEXT_PUBLIC_ATTRIBUTION_SOURCE || '' }}
          IO_NEXT_PUBLIC_ATTRIBUTION_COOKIE_DOMAIN: ${{ inputs.retain_release_bundle && '.fastgpt.io' || '' }}
          IO_NEXT_PUBLIC_ATTRIBUTION_SOURCE: ${{ inputs.retain_release_bundle && 'home-io' || '' }}
        run: |
          if [ "$RETAIN_RELEASE_BUNDLE" = "true" ]; then
            test -n "$NEXT_PUBLIC_CRM_API_URL"
          fi
          npm ci
          args=(--keep-artifacts --capacity-report .release-artifacts/capacity-report.json)
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args+=(--allow-missing-solutions-evidence)
          fi
          if [ "$RETAIN_RELEASE_BUNDLE" = "true" ]; then
            args+=(--retain-success-artifacts "$RUNNER_TEMP/technical-full-release-bundle")
          fi
          npm run verify:release -- "${args[@]}"

      - name: Upload complete verified release bundle
        if: ${{ success() && inputs.retain_release_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: technical-full-release-bundle
          path: ${{ runner.temp }}/technical-full-release-bundle
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Verify postdeploy owner URLs
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.retain_release_bundle }}
        run: |
          mkdir -p .release-artifacts/postdeploy
          npm run verify:week06-wave1-live | tee .release-artifacts/postdeploy/week06-wave1-live.log

      - name: Verify postdeploy observation window
        if: ${{ always() && github.event_name == 'workflow_dispatch' && !inputs.retain_release_bundle }}
        run: |
          mkdir -p .release-artifacts/postdeploy
          npm run verify:week06-wave1-observation | tee .release-artifacts/postdeploy/week06-wave1-observation.log

      - name: Upload release verification record and artifacts
        if: ${{ always() && hashFiles('.release-artifacts/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: technical-content-release-evidence
          path: .release-artifacts
          retention-days: 90
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Link Week05 evidence to issue #247
        if: always()
        run: |
          {
            echo '## Week05 release evidence'
            echo '- Issue: https://github.com/labring/fastgpt-home/issues/247'
            echo '- Record: `.release-artifacts/release-verification.json`'
            echo '- Uploaded artifact: `technical-content-release-evidence` (90-day retention)'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-runtime:
    name: Verify Docker runtime
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image and validate Nginx
        run: |
          docker build --target runtime \
            --build-arg NEXT_PUBLIC_SITE_VARIANT=cn \
            --build-arg NEXT_PUBLIC_HOME_URL=https://fastgpt.cn \
            --build-arg NEXT_PUBLIC_CN_HOME_URL=https://fastgpt.cn \
            --build-arg NEXT_PUBLIC_IO_HOME_URL=https://fastgpt.io \
            --tag fastgpt-home-runtime:${{ github.sha }} .
