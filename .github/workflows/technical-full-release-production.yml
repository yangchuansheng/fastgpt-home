name: Technical full release production controller

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Release controller action'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - activate
          - rollback
      source_revision:
        description: 'Candidate source revision (preflight/activate)'
        required: false
        type: string
      bundle_sha256:
        description: 'Candidate release bundle SHA-256 (preflight/activate)'
        required: false
        type: string
      candidate_artifact_run_id:
        description: 'Workflow run containing the candidate bundle (preflight/activate)'
        required: false
        type: string
      candidate_artifact_name:
        description: 'Candidate release bundle artifact name'
        required: false
        default: technical-full-release-bundle
        type: string
      previous_source_revision:
        description: 'Previous complete release source revision'
        required: true
        type: string
      previous_bundle_sha256:
        description: 'Previous complete release bundle SHA-256'
        required: true
        type: string
      previous_artifact_run_id:
        description: 'Workflow run containing the previous complete release bundle'
        required: true
        type: string
      previous_artifact_name:
        description: 'Previous complete release bundle artifact name'
        required: true
        default: technical-full-release-bundle
        type: string
      image_manifest:
        description: 'Signed JSON mapping release bundles to immutable CN and IO images'
        required: true
        type: string
      image_manifest_signature:
        description: 'HMAC-SHA256 signature for the image manifest'
        required: true
        type: string
      maintenance_window_start:
        description: 'Approved maintenance window start in ISO 8601 UTC'
        required: false
        type: string
      maintenance_window_end:
        description: 'Approved maintenance window end in ISO 8601 UTC'
        required: false
        type: string

concurrency:
  group: technical-full-release-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  controller:
    if: github.repository == 'labring/fastgpt-home' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout controller source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify candidate source selection
        if: inputs.action != 'rollback'
        env:
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_revision }}
        run: test "$GITHUB_SHA" = "$RELEASE_SOURCE_COMMIT"

      - name: Set up kubectl
        if: inputs.action != 'preflight'
        uses: azure/setup-kubectl@v4

      - name: Download candidate release bundle
        if: inputs.action != 'rollback'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_artifact_run_id }}
          name: ${{ inputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/candidate-release

      - name: Download previous complete release bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.previous_artifact_run_id }}
          name: ${{ inputs.previous_artifact_name }}
          path: ${{ runner.temp }}/previous-release

      - name: Configure Kubernetes credentials
        if: inputs.action != 'preflight'
        env:
          RELEASE_KUBE_CONFIG: ${{ secrets.TECHNICAL_RELEASE_KUBE_CONFIG }}
        run: |
          test -n "$RELEASE_KUBE_CONFIG"
          install -m 600 /dev/null "$RUNNER_TEMP/technical-release-kubeconfig"
          printf '%s' "$RELEASE_KUBE_CONFIG" > "$RUNNER_TEMP/technical-release-kubeconfig"

      - name: Run production release controller
        env:
          KUBECONFIG: ${{ runner.temp }}/technical-release-kubeconfig
          RELEASE_BUNDLE: ${{ runner.temp }}/candidate-release
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_revision }}
          RELEASE_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          PREVIOUS_RELEASE_BUNDLE: ${{ runner.temp }}/previous-release
          PREVIOUS_RELEASE_SOURCE_COMMIT: ${{ inputs.previous_source_revision }}
          PREVIOUS_RELEASE_BUNDLE_SHA256: ${{ inputs.previous_bundle_sha256 }}
          RELEASE_CN_CONTEXT: ${{ vars.TECHNICAL_RELEASE_CN_CONTEXT }}
          RELEASE_CN_NAMESPACE: ${{ vars.TECHNICAL_RELEASE_CN_NAMESPACE }}
          RELEASE_CN_TARGET: ${{ vars.TECHNICAL_RELEASE_CN_TARGET }}
          RELEASE_CN_CONTAINER: ${{ vars.TECHNICAL_RELEASE_CN_CONTAINER }}
          RELEASE_IO_CONTEXT: ${{ vars.TECHNICAL_RELEASE_IO_CONTEXT }}
          RELEASE_IO_NAMESPACE: ${{ vars.TECHNICAL_RELEASE_IO_NAMESPACE }}
          RELEASE_IO_TARGET: ${{ vars.TECHNICAL_RELEASE_IO_TARGET }}
          RELEASE_IO_CONTAINER: ${{ vars.TECHNICAL_RELEASE_IO_CONTAINER }}
          RELEASE_IMAGE_MANIFEST: ${{ inputs.image_manifest }}
          RELEASE_IMAGE_MANIFEST_SIGNATURE: ${{ inputs.image_manifest_signature }}
          RELEASE_IMAGE_MANIFEST_KEY: ${{ secrets.TECHNICAL_RELEASE_IMAGE_MANIFEST_KEY }}
          RELEASE_MAINTENANCE_WINDOW_START: ${{ inputs.maintenance_window_start }}
          RELEASE_MAINTENANCE_WINDOW_END: ${{ inputs.maintenance_window_end }}
          RELEASE_APPROVAL_TOKEN: ${{ secrets.TECHNICAL_RELEASE_APPROVAL_TOKEN }}
          RELEASE_APPROVAL_TOKEN_SHA256: ${{ vars.TECHNICAL_RELEASE_APPROVAL_TOKEN_SHA256 }}
        run: npm run release:technical-full -- ${{ inputs.action }}
